[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-internals-lab"
version = "0.1.0"
description = "Answers 'why did latency spike when nothing changed?': how the JVM, CPython and V8 really manage memory, garbage collection and compilation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A runaway workload fails the test instead of hanging the run.
timeout = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603"]

[tool.mypy]
strict = true
files = ["src", "tests"]
